# YOLO 인식 FPS KPI (원 명세 6장 "CPU 10 FPS 또는 GPU 30 FPS", 연우). **초안: 아직 한 번도 돌려 보지 않았다.**
# 로봇 1대 + 위치 추정 + 카메라 + YOLO 인식(system.launch.py detection:=true) + 동적 장애물 5개 + 화물 상자 24개.
# Nav2·Fleet·BT는 끈다. 로봇은 움직이지 않는다.
#
#   tools/harness/docker_run.sh yolo_fps -n 1 --label smoke
#   tools/harness/gcp_run.sh yolo_fps -n 3 --label smoke --pr <번호> --slot b2
#
# 장면: 로봇이 A–B 통로 world (7.0, 3.0)에서 동남동을 본다 (experiments/yolo/fps_robots.yaml). 시야에 표지판 2개(약 5.6·7.5 m),
# 화물 상자 1개(약 5.8 m), 곡선 경로를 오가는 작업자 worker_2(경로의 약 20 %가 10 m 안)가 들어온다.
# 측정: 주행 명령이 데움(warmup_s) 뒤 duration_s 동안의 시작·끝 시각(실제 시간)을 detection/window_start·window_end에 적고,
# 후처리(detection_fps.py)가 detection_node의 5 s 통계 줄(logs/system.log) 중 이 구간 안에 다 든 것만 모아 detection/fps.json을 쓴다.
# 노드의 FPS가 실제 시간 기준(time.monotonic)이라 측정 시간도 실제 시간으로 잡는다. RTF는 meta.json에 남는다.
# 요약: detect.fps.mean(KPI ≥ 10, CI 하한으로 판정)과 참고 지표 (README "인식 지표"). cpu.csv로 Gazebo(카메라 렌더링)와
# 인식 노드가 쓴 코어 수(sys.cpu_cores.sim·perception)를 같이 남긴다.
name: yolo_fps
# docker_run.sh가 빌드할 패키지 (amr_bringup이 amr_detection·amr_gazebo를 함께 끌어온다)
packages: amr_bringup
num_robots: 1
use_sim_time: true
seed_base: 1
# 주행(데움 + 측정) 제한, 실제 시간 [s]. driver.timeout_s보다 길게
timeout_s: 1200
params:
  # 데움 [s, 실제 시간]. 준비 확인·화물 스폰 직후 부하를 뺀다
  warmup_s: "10"
  # 측정 시간 [s, 실제 시간]. 통계 줄이 5 s마다라 120 s면 구간 약 23개. warmup_s + duration_s는 driver.timeout_s(900)보다 짧게
  duration_s: "120"
processes:
  - name: system
    cmd: >-
      ros2 launch amr_bringup system.launch.py num_robots:=1 gui:=false enable_camera:=true detection:=true
      dynamic_obstacles:=true fleet:=false bt:=false seed:={seed} robots_file:=/repo/experiments/yolo/fps_robots.yaml
    ready_topic: /amr_01/odometry/filtered
    ready_timeout_s: 300
    # 인식 노드는 촬영 시각의 map 기준 TF가 있어야 발행한다(AMCL active 뒤). 한 번 발행하면 모델·카메라·TF가 다 된 것이다
    ready_cmds:
      - ros2 lifecycle get /map_server | grep -q '^active'
      - ros2 lifecycle get /amr_01/amcl | grep -q '^active'
      - timeout 25 ros2 topic echo --once /amr_01/perception/objects > /dev/null
    settle_s: 3
  # 화물 상자 24개 (sim.launch.py cargo:=true와 같은 launch). system.launch.py에는 화물 인자가 없어 따로 띄운다.
  # 스폰이 끝나면 launch도 끝나므로 표시 파일을 만들고 기다린다 (바로 끝나면 하네스가 기동 실패로 본다)
  - name: cargo
    cmd: ros2 launch amr_gazebo cargo_boxes.launch.py && touch {run_dir}/cargo_spawned; exec sleep infinity
    ready_cmds:
      - test -f {run_dir}/cargo_spawned
    ready_timeout_s: 120
  - name: cpu_monitor
    cmd: python3 /repo/tools/harness/cpu_monitor.py --out {run_dir}/cpu.csv --interval 1.0
    settle_s: 1
driver:
  # 데움 → 측정 구간 표시. 명령이 도는 동안 drive.py가 시계를 돌려 RTF를 잰다
  mode: command
  use_sim_time: true
  timeout_s: 900
  cmd: >-
    mkdir -p {run_dir}/detection && sleep {warmup_s} && date +%s.%N > {run_dir}/detection/window_start
    && sleep {duration_s} && date +%s.%N > {run_dir}/detection/window_end
# detection/fps.json (FPS·추론·지연, 구간 목록). 쓸 통계 구간이 없으면 후처리 실패로 남는다
postprocess:
  - name: detection_fps
    cmd: python3 /repo/tools/harness/detection_fps.py {run_dir}
cleanup:
  - pkill -9 -f "[i]gn gazebo" || true
  - pkill -9 -f "[p]arameter_bridge" || true
